<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">

  <title>AIMS - Home</title>
  <meta name="description" content="AIMS System - Contactless vital signs monitoring">

  <!-- Favicons -->
  <link href="assets/img/icon.png" rel="icon">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;500;600;700&family=Poppins:wght@300;400;500;600;700&family=Source+Sans+Pro:wght@300;400;600;700&display=swap" rel="stylesheet">

  <!-- Vendor Icons -->
  <link href="assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">

  <!-- Tailwind CSS -->
  <link href="assets/css/tailwind.css" rel="stylesheet">
</head>

<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col justify-between">

  <!-- ======= Header ======= -->
  <header id="header" class="bg-white border-b border-gray-200 sticky top-0 z-50 transition-all duration-300">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <a href="/" class="flex items-center space-x-1">
        <h1 class="text-2xl font-bold tracking-tight text-gray-900">AIMS<span class="text-primary font-black">.</span></h1>
      </a>
    </div>
  </header>

  <!-- ======= Main Content ======= -->
  <main class="flex-grow flex flex-col items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    
    <!-- Hero Section -->
    <div class="text-center max-w-2xl mx-auto mb-12">
      <h2 class="text-4xl font-extrabold text-gray-900 sm:text-5xl tracking-tight">
        Welcome to <span class="text-primary">AIMS</span>
      </h2>
      <p class="mt-4 text-lg text-gray-600">
        Contactless real-time monitoring of subjects' vital signs.
      </p>
    </div>

    <!-- Featured Services Grid -->
    <div class="max-w-md w-full mx-auto px-4">
      
      <!-- Card: Monitoring -->
      <a href="/monitoring" class="group relative bg-white p-6 rounded-2xl shadow-sm border border-gray-100 hover:shadow-md hover:border-primary/30 transition-all duration-300 transform hover:-translate-y-1 flex flex-col justify-between h-48">
        <div>
          <div class="w-12 h-12 rounded-xl bg-primary/10 flex items-center justify-center text-primary group-hover:bg-primary group-hover:text-white transition-colors duration-300">
            <i class="bi bi-activity text-2xl"></i>
          </div>
          <h3 class="mt-4 text-xl font-bold text-gray-900 group-hover:text-primary transition-colors duration-300">Monitoring</h3>
          <p class="mt-2 text-sm text-gray-500">Start monitoring and capturing data.</p>
        </div>
        <span class="absolute bottom-6 right-6 text-primary opacity-0 group-hover:opacity-100 transition-opacity duration-300">
          <i class="bi bi-arrow-right text-lg"></i>
        </span>
      </a>

    </div>
  </main>

  <!-- ======= Footer ======= -->
  <footer class="bg-white border-t border-gray-200 py-6 text-center text-sm text-gray-500">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <p>&copy; 2026 AIMS System. All rights reserved.</p>
    </div>
  </footer>

  <script>
    // Simple page fade-in
    document.addEventListener("DOMContentLoaded", () => {
      document.body.classList.add("opacity-100");
    });
  </script>
</body>

</html>
