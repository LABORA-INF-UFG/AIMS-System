     <!--Script responsável pela atualização da UI e display dos pacientes buscados-->
     <script>

      let timesOut = [];
      const notFoundWarn = document.createElement('span');
      notFoundWarn.innerText = 'Nenhum paciente encontrado com este nome.';
      let patients = null;
      let selected_patient = null;

      let search_container_div = document.getElementById("search_box");
      let selected_patient_text_span = document.getElementById("selected_patient_text");
      let edit_patient_div = document.getElementById("patient-edit-container");
      let pacient_span = document.getElementById("pacient_span");

      
      function select_patient(params){
        let btn_index = params.srcElement.value;
        let patient_form = document.getElementById("patient-data-form");
        let update_form_btn = document.getElementById("update_form_btn");

        //salvando o paciente selecionado pelo usuário
        selected_patient = patients[btn_index].nome;

        search_container_div.style.display = 'none';
        selected_patient_text_span.textContent = selected_patient;
        selected_patient_text_span.style.display = 'block';
        pacient_span.textContent = "Paciente selecionado(a)"
        document.getElementById("search-results").style.display = 'none';
        //mostrando o container com o monitoramento vindo do ROS
        document.getElementById("monitoring-container").style.display = 'block';
      }

      const search_box = document.getElementById('search_box');

      //função para buscar pacientes
      search_box.addEventListener('keyup', (event) => {
        event.preventDefault();

        for (let index = 0; index < timesOut.length-1; index++) {
          clearTimeout(timesOut[index]);
        }

        timesOut.push(setTimeout(async ()=>{

          timesOut.length = 0;

          try {
            if(search_box.value != '')
            {
              const res = await fetch('/getpatients?' + new URLSearchParams(
                {nome: search_box.value}
              ));

              patients = await res.json();

              const results = document.getElementById('search-results');

              //console.log(Object.keys(patients).length)
              if(Object.keys(patients).length !== 0)
              {
                results.innerHTML = '';

                // single patient structure
                let patient_block = null;
                let span_nome = null;
                let span_idade = null;
                let idade = null;
                let edit_button = null;

                patients.forEach((patient, index) => {
                  patient_block = document.createElement('div');
                  span_nome = document.createElement('span');
                  span_idade = document.createElement('span');
                  select_button = document.createElement('button');

                  delete_button = document.createElement('button');

                  span_nome.innerText = patient.nome;

                  // elemento do botão e função para ativar view da edição de paciente
                  select_button.name = 'index';
                  select_button.value = index;
                  select_button.innerText = 'Selecionar';
                  select_button.onclick = select_patient //function () { console.log(index) };

                  // calculo de idade
                  idade = Date.now() - Date.parse(patient.data_nascimento);
                  idade = new Date(idade);
                  idade = idade.getFullYear();
                  idade = idade - 1970;

                  span_idade.innerText = ' (' + idade.toString() + ' anos) ';

                  patient_block.appendChild(span_nome);
                  patient_block.appendChild(span_idade);
                  patient_block.appendChild(select_button);

                  results.appendChild(patient_block);
                });
              }
              else{
                results.innerHTML = '';
                results.appendChild(notFoundWarn);
              }

            }

          }
          catch (error) {
            console.log(error);
          }
        }, 500))

      });

    </script>

      //Atualiza o gráfico sempre que chega um novo valor vindo do tópico
      function atualizaHistograma(value){
        if (value > 0){
            histograma.config.data.datasets[0].data[value] = histograma.config.data.datasets[0].data[value] + 1;
            histograma.update();
        }
      }
      function atualizaSinal2(value){
        const frequency = value; // frequency in Hz
        const duration = 1; // duration in seconds
        const amplitude = 1; // amplitude of the signal

        const timeStep = 0.01; // time step in seconds
        const numSteps = Math.floor(duration / timeStep); // number of time steps

        const signal = sinal.config.data.datasets[0].data;
        //sliding the signal
        signal.splice(0, 100);

        for (let i = 0; i < numSteps; i++) {
          const time = i * timeStep; // current time in seconds
          const y = amplitude * Math.sin(2 * Math.PI * frequency * time); // signal value at current time
          signal.push(y); // add signal value to array
        }
        sinal.config.data.datasets[0].data = signal;

        sinal.update();
      }

      }

       function draw(freq, amp, om) {
            if (om !== null) {
                phi = om;
            }
            var ctx = document.getElementById('plot-sinal').getContext("2d");
            if (freq > 0){
                var omega = 1;

                ctx.clearRect(0, 0, document.getElementById('plot-sinal').width, document.getElementById('plot-sinal').height);
                ctx.lineWidth = 2;
                ctx.lineColor = 'cyan';
                ctx.lineJoin = 'round';
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(0, 100 - amplitude * Math.sin(omega*counter - phi));
                //var frequency = 190;
                var increase = Math.PI / (1000 / freq);
                var counter = 0;

                for (x=0; x < 1000; x++){
                    ctx.lineTo(x, (100 - amplitude * Math.sin(omega*counter - phi)));
                    counter += increase;
                }
                ctx.strokeStyle = 'blue';
                ctx.stroke();
            }else{
                ctx.clearRect(0, 0, document.getElementById('plot-sinal').width, document.getElementById('plot-sinal').height);
            }
        }
