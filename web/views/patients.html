<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">

    <title>AIMS - Paciente</title>
    <meta name="description" content="AIMS Patient Directory">

    <!-- Favicons -->
    <link href="assets/img/icon.png" rel="icon">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;500;600;700&family=Poppins:wght@300;400;500;600;700&family=Source+Sans+Pro:wght@300;400;600;700&display=swap" rel="stylesheet">

    <!-- Vendor Icons -->
    <link href="assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">

    <!-- Tailwind CSS -->
    <link href="assets/css/tailwind.css" rel="stylesheet">
</head>

<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col justify-between">

    <!-- ======= Header ======= -->
    <header id="header" class="bg-white border-b border-gray-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <a href="/" class="flex items-center space-x-1">
                <h1 class="text-2xl font-bold tracking-tight text-gray-900">AIMS<span class="text-primary font-black">.</span></h1>
            </a>
            <a class="px-4 py-2 bg-primary hover:bg-primary-dark text-white rounded-lg text-sm font-semibold shadow-sm transition" href="/registration">
                <i class="bi bi-person-plus me-1"></i> Cadastrar
            </a>
        </div>
    </header>

    <!-- ======= Main Content ======= -->
    <main class="flex-grow flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
        <div class="max-w-xl w-full bg-white p-8 rounded-2xl shadow-sm border border-gray-100">

            <!-- Directory Search View -->
            <div id="search-container" class="space-y-6">
                <div class="text-center">
                    <h2 class="text-3xl font-extrabold text-gray-900 tracking-tight">Pacientes</h2>
                    <p class="mt-2 text-sm text-gray-500">Pesquise por um paciente para atualizar dados ou gerenciar seu perfil.</p>
                </div>

                <!-- Search Input Group -->
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                        <i class="bi bi-search"></i>
                    </div>
                    <input type="text" name="nome_buscado" id="search_box" maxlength="50"
                        class="block w-full pl-10 pr-4 py-3 bg-gray-50 border border-gray-300 rounded-xl shadow-inner focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary text-gray-900 transition placeholder-gray-400"
                        placeholder="Pesquise por um nome...">
                </div>

                <!-- Search Results Container -->
                <div id="results" class="space-y-3 max-h-96 overflow-y-auto pr-1"></div>
            </div>

            <!-- Patient Edit View (Initially Hidden) -->
            <div id="patient-edit-container" class="space-y-6" style="display: none;">
                <div class="text-center">
                    <h2 class="text-3xl font-extrabold text-gray-900 tracking-tight">Editar Paciente</h2>
                    <p class="mt-2 text-sm text-gray-500">Atualize as informações cadastrais do paciente abaixo.</p>
                </div>

                <form id="patient-data-form" class="space-y-5">
                    <!-- Nome Completo -->
                    <div>
                        <label for="nome_field" class="block text-sm font-semibold text-gray-700">Nome completo</label>
                        <input type="text" name="nome" id="nome_field" required 
                            class="mt-1 block w-full px-4 py-2 bg-white border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary text-gray-900 transition">
                    </div>

                    <!-- Nascimento & Sexo -->
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label for="data_nascimento_field" class="block text-sm font-semibold text-gray-700">Data de Nascimento</label>
                            <input type="date" name="data_nascimento" id="data_nascimento_field" required 
                                class="mt-1 block w-full px-4 py-2 bg-white border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary text-gray-900 transition">
                        </div>
                        <div>
                            <label for="sexo_field" class="block text-sm font-semibold text-gray-700">Sexo</label>
                            <select name="sexo" id="sexo_field" required 
                                class="mt-1 block w-full px-4 py-2 bg-white border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary text-gray-900 transition">
                                <option value="M">Masculino</option>
                                <option value="F">Feminino</option>
                            </select>
                        </div>
                    </div>

                    <!-- Peso & Altura -->
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label for="peso_field" class="block text-sm font-semibold text-gray-700">Peso (kg)</label>
                            <input type="number" step="0.01" min="0" name="peso" id="peso_field" required 
                                class="mt-1 block w-full px-4 py-2 bg-white border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary text-gray-900 transition">
                        </div>
                        <div>
                            <label for="altura_field" class="block text-sm font-semibold text-gray-700">Altura (cm)</label>
                            <input type="number" min="0" name="altura" id="altura_field" required 
                                class="mt-1 block w-full px-4 py-2 bg-white border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary text-gray-900 transition">
                        </div>
                    </div>
                </form>

                <!-- Actions -->
                <div id="bottom_menu" class="flex items-center justify-end space-x-3 pt-4 border-t border-gray-100">
                    <a href="javascript:toggle_search_container_visibility()" id="btn" 
                        class="px-4 py-2 border border-gray-300 rounded-lg text-sm font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary/50 transition">
                        Voltar
                    </a>
                    <button id="update_form_btn" form="patient-data-form" 
                        class="px-5 py-2 bg-primary hover:bg-primary-dark text-white rounded-lg text-sm font-medium shadow-sm focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary/50 transition">
                        Atualizar
                    </button>
                </div>
            </div>

        </div>
    </main>

    <!-- ======= Footer ======= -->
    <footer class="bg-white border-t border-gray-200 py-6 text-center text-sm text-gray-500">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <p>&copy; 2026 AIMS System. Todos os direitos reservados.</p>
        </div>
    </footer>

    <!-- Search / List UI Script -->
    <script>
        let timesOut = [];
        const notFoundWarn = document.createElement('div');
        notFoundWarn.className = 'p-4 bg-yellow-50 text-yellow-800 text-sm border border-yellow-100 rounded-xl text-center';
        notFoundWarn.innerText = 'Nenhum paciente encontrado com este nome.';

        let patients = null;
        let search_container_div = document.getElementById("search-container");
        let edit_patient_div = document.getElementById("patient-edit-container");

        async function deletePatient(index) {
            const confirmDelete = confirm('Tem certeza que deseja deletar o paciente?');
            if (confirmDelete) {
                const response = await fetch(`/deletepatient?id=${patients[index]._id}`, {
                    method: 'DELETE'
                });
                if (response.status === 204) {
                    patients.splice(index, 1);
                    alert('Paciente removido com sucesso');
                    updateSearchResults();
                } else {
                    console.log('Falha ao excluir paciente');
                }
            }
        }

        function edit_patient_view(params) {
            let btn_index = params.srcElement.value;
            let patient_form = document.getElementById("patient-data-form");
            let update_form_btn = document.getElementById("update_form_btn");

            update_form_btn.name = 'index';
            update_form_btn.value = btn_index;

            search_container_div.style.display = 'none';
            edit_patient_div.style.display = 'block';

            patient_form.nome.value = patients[btn_index].nome;
            patient_form.data_nascimento.value = (patients[btn_index].data_nascimento).slice(0, 10);
            patient_form.altura.value = patients[btn_index].altura;
            patient_form.peso.value = patients[btn_index].peso;
            patient_form.sexo.value = patients[btn_index].sexo;
        }

        function toggle_search_container_visibility() {
            search_container_div.style.display = 'block';
            edit_patient_div.style.display = 'none';
        }

        function updateSearchResults() {
            const results = document.getElementById('results');
            results.innerHTML = '';

            if (patients && Object.keys(patients).length !== 0) {
                patients.forEach((patient, index) => {
                    if (!patient.deleted) {
                        const patient_block = document.createElement('div');
                        patient_block.className = 'flex items-center justify-between p-4 bg-white border border-gray-200 rounded-xl shadow-sm hover:shadow-md transition duration-200';

                        // Info container
                        const info_div = document.createElement('div');
                        info_div.className = 'flex flex-col';

                        const span_nome = document.createElement('span');
                        span_nome.className = 'font-bold text-gray-900 text-base';
                        span_nome.innerText = patient.nome;

                        const span_idade = document.createElement('span');
                        span_idade.className = 'text-xs text-gray-500 mt-0.5';

                        let idade = Date.now() - Date.parse(patient.data_nascimento);
                        idade = new Date(idade);
                        idade = idade.getFullYear() - 1970;
                        span_idade.innerText = `${idade.toString()} anos`;

                        info_div.appendChild(span_nome);
                        info_div.appendChild(span_idade);

                        // Actions container
                        const actions_div = document.createElement('div');
                        actions_div.className = 'flex space-x-2';

                        const edit_button = document.createElement('button');
                        edit_button.name = 'index';
                        edit_button.value = index;
                        edit_button.innerText = 'Editar';
                        edit_button.onclick = edit_patient_view;
                        edit_button.className = 'px-3 py-1.5 bg-primary/10 hover:bg-primary text-primary hover:text-white rounded-lg text-xs font-semibold transition-colors duration-150 cursor-pointer';

                        const delete_button = document.createElement('button');
                        delete_button.name = 'index';
                        delete_button.value = index;
                        delete_button.innerText = 'Deletar';
                        delete_button.onclick = function() {
                            deletePatient(index);
                        };
                        delete_button.className = 'px-3 py-1.5 bg-red-50 hover:bg-red-500 text-red-600 hover:text-white rounded-lg text-xs font-semibold transition-colors duration-150 cursor-pointer';

                        actions_div.appendChild(edit_button);
                        actions_div.appendChild(delete_button);

                        patient_block.appendChild(info_div);
                        patient_block.appendChild(actions_div);

                        results.appendChild(patient_block);
                    }
                });
            } else {
                results.appendChild(notFoundWarn);
            }
        }

        const search_box = document.getElementById('search_box');
        search_box.addEventListener('keyup', (event) => {
            event.preventDefault();

            for (let index = 0; index < timesOut.length - 1; index++) {
                clearTimeout(timesOut[index]);
            }

            timesOut.push(setTimeout(async () => {
                timesOut.length = 0;

                try {
                    if (search_box.value != '') {
                        const res = await fetch('/getpatients?' + new URLSearchParams({ nome: search_box.value }));
                        patients = await res.json();
                        updateSearchResults();
                    } else {
                        document.getElementById('results').innerHTML = '';
                    }
                } catch (error) {
                    console.log(error);
                }
            }, 500));
        });
    </script>

    <!-- Form Submission Script -->
    <script>
        // set the max date of the date selection for today
        document.getElementById("data_nascimento_field").setAttribute("max", new Date().toISOString().split("T")[0]);

        // get the form object
        const form = document.getElementById('patient-data-form');

        form.addEventListener('submit', async (event) => {
            event.preventDefault();

            const nome = form.nome.value;
            const data_nascimento = form.data_nascimento.value;
            const altura = form.altura.value;
            const peso = form.peso.value;
            const sexo = form.sexo.value;
            const _id = patients[document.getElementById('update_form_btn').value]._id;

            try {
                const res = await fetch('/updatepatient', {
                    method: 'PUT',
                    body: JSON.stringify({ nome, data_nascimento, altura, peso, sexo, _id }),
                    headers: { 'Content-Type': 'application/json' }
                });

                if (res.status === 200) {
                    const results = document.getElementById('results');
                    results.innerHTML = '';
                    window.alert("Dados do paciente atualizados com sucesso!");
                    form.reset();
                    toggle_search_container_visibility();
                } else {
                    window.alert("Paciente não atualizado. Cheque se os campos foram preenchidos corretamente.");
                }
            } catch (error) {
                console.log(error);
            }
        });
    </script>

</body>

</html>
