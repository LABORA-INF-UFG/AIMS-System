    <!--Script responsável pela atualização da UI e display dos pacientes buscados-->
    <script>

     let timesOut = [];
const notFoundWarn = document.createElement('span');
notFoundWarn.innerText = 'Nenhum paciente encontrado com este nome.';
notFoundWarn.classList.add('not-found-warning'); // Adiciona a classe CSS "not-found-warning" à span

let patients = null;
let search_container_div = document.getElementById("search-container");
let edit_patient_div = document.getElementById("patient-edit-container");

async function deletePatient(index) {
  const confirmDelete = confirm('Tem certeza que deseja deletar o paciente?');
  if (confirmDelete) {
    const response = await fetch(`/deletepatient?id=${patients[index]._id}`, {
      method: 'DELETE'
    });
    if (response.status === 204) {
      patients.splice(index, 1);
      alert('Paciente removido com sucesso');
      updateSearchResults();
    } else {
      console.log('Falha ao excluir paciente');
    }
  }
}

function edit_patient_view(params) {
  let btn_index = params.srcElement.value;
  let patient_form = document.getElementById("patient-data-form");
  let update_form_btn = document.getElementById("update_form_btn");

  update_form_btn.name = 'index';
  update_form_btn.value = btn_index;

  search_container_div.style.display = 'none';
  edit_patient_div.style.display = 'unset';

  patient_form.nome.value = patients[btn_index].nome;
  patient_form.data_nascimento.value = (patients[btn_index].data_nascimento).slice(0, 10);
  patient_form.altura.value = patients[btn_index].altura;
  patient_form.peso.value = patients[btn_index].peso;
  patient_form.sexo.value = patients[btn_index].sexo;
}

function toggle_search_container_visibility() {
  search_container_div.style.display = 'unset';
  edit_patient_div.style.display = 'none';
}

function updateSearchResults() {
  const results = document.getElementById('results');
  results.innerHTML = '';

  if (Object.keys(patients).length !== 0) {
    let patient_block = null;
    let span_nome = null;
    let span_idade = null;
    let idade = null;
    let edit_button = null;
    let delete_button = null;

    patients.forEach((patient, index) => {
      if (!patient.deleted) { // Verificar se o paciente foi deletado
        patient_block = document.createElement('div');
        span_nome = document.createElement('span');
        span_idade = document.createElement('span');
        edit_button = document.createElement('button');
        delete_button = document.createElement('button');

        span_nome.innerText = patient.nome;

        edit_button.name = 'index';
        edit_button.value = index;
        edit_button.innerText = 'Editar';
        edit_button.onclick = edit_patient_view;
        edit_button.className = 'system-button';

        delete_button.name = 'index';
        delete_button.value = index;
        delete_button.innerText = 'Deletar';
        delete_button.onclick = function() {
          deletePatient(index);
          this.parentNode.remove();
        };
        delete_button.className = 'system-button delete-button';

        idade = Date.now() - Date.parse(patient.data_nascimento);
        idade = new Date(idade);
        idade = idade.getFullYear();
        idade = idade - 1970;


        span_idade.innerText = ` - ${idade.toString()} anos`;


        patient_block.appendChild(span_nome);
        patient_block.appendChild(span_idade);
        patient_block.appendChild(edit_button);
        patient_block.appendChild(delete_button);

        results.appendChild(patient_block);
      }
    });
  } else {
    results.appendChild(notFoundWarn);
  }
}

const search_box = document.getElementById('search_box');
search_box.addEventListener('keyup', (event) => {
  event.preventDefault();

  for (let index = 0; index < timesOut.length - 1; index++) {
    clearTimeout(timesOut[index]);
  }

  timesOut.push(setTimeout(async () => {
    timesOut.length = 0;

    try {
      if (search_box.value != '') {
        const res = await fetch('/getpatients?' + new URLSearchParams({ nome: search_box.value }));
        patients = await res.json();
        updateSearchResults();
      }
    } catch (error) {
      console.log(error);
    }
  }, 500));
});


    </script>

    <!--Script responsável por atualizar o funcionário-->
    <script>
        // set the max date of the date selection for today
        document.getElementById("data_nascimento_field").setAttribute("max", new Date().toISOString().split("T")[0]);

        // get the form object
        const form = document.querySelector('form');

        form.addEventListener('submit', async (event) => {
            event.preventDefault();

            const nome = form.nome.value;
            const data_nascimento = form.data_nascimento.value;
            const altura = form.altura.value;
            const peso = form.peso.value;
            const sexo = form.sexo.value;
            const _id = patients[form.index.value]._id;

            try {

                const res = await fetch('/updatepatient', {
                    method: 'PUT',
                    body: JSON.stringify({ nome, data_nascimento, altura, peso, sexo, _id }),
                    headers: { 'Content-Type': 'application/json' }
                });

                if (res.status === 200) {
                    const results = document.getElementById('results');
                    results.innerHTML = '';
                    window.alert("Dados do paciente atualizado com sucesso!");
                    form.reset();
                    toggle_search_container_visibility();
                }
                else {
                    window.alert("Paciente não atualizado. Cheque se os campos foram preenchidos corretamente.");
                }
            }
            catch (error) {
                console.log(error);
            }
        });
    </script>
