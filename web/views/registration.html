<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">

  <title>AIMS - Paciente</title>
  <meta content="" name="description">
  <meta content="" name="keywords">

  <!-- Favicons -->
  <link href="assets/img/icon.png" rel="icon">
  <link href="assets/img/icon.png" rel="icon">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&family=Source+Sans+Pro:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400;1,600;1,700&display=swap"
    rel="stylesheet">

  <!-- Vendor CSS Files -->
  <link href="assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
  <link href="assets/vendor/aos/aos.css" rel="stylesheet">
  <link href="assets/vendor/glightbox/css/glightbox.min.css" rel="stylesheet">
  <link href="assets/vendor/swiper/swiper-bundle.min.css" rel="stylesheet">
  <link href="assets/css/variables.css" rel="stylesheet">
  <link href="assets/css/main.css" rel="stylesheet">
</head>

<body>
  <!-- ======= Header ======= -->
  <header id="header" class="header fixed-top" data-scrollto-offset="0">
    <div class="container-fluid d-flex align-items-center justify-content-between">
      <a href="index.html" class="logo d-flex align-items-center scrollto me-auto me-lg-0">
        <h1>AIMS<span>.</span></h1>
      </a>
    </div>
  </header><!-- End Header -->

  <section id="hero-static" class="hero-static d-flex align-items-center">
    <div class="container d-flex flex-column justify-content-center align-items-center text-center position-relative"
      data-aos="zoom-out">
      <h2>Cadastro de pacientes<span></span></h2>
      </br>
      <form id="cadastro">
        <div class="form-group">
          <div class="row">
            <div class="col-md-12">
              <label for="nome_completo_field">Nome Completo</label>
              <input type="text" name="nome_completo" id="nome_completo_field" required class="form-control"
                placeholder="Nome Completo">
            </div>
          </div>
        </div>

        <div class="form-group">
          <div class="row">
            <div class="col-md-6">
              <label for="data_nascimento_field">Data de Nascimento</label>
              <input type="date" name="data_nascimento" id="data_nascimento_field" required class="form-control">
            </div>
            <div class="col-md-6">
              <label for="sexo_field">Sexo</label>
              <select name="sexo" id="sexo_field" required class="form-control">
                <option value="M">Masculino</option>
                <option value="F">Feminino</option>
              </select>
            </div>
          </div>
        </div>

        <div class="form-group">
          <div class="row">
            <div class="col-md-6">
              <label for="peso_field">Peso (kg)</label>
              <input type="number" step="0.01" min="0" name="peso" id="peso_field" required class="form-control"
                placeholder="Peso">
            </div>
            <div class="col-md-6">
              <label for="altura_field">Altura (cm)</label>
              <input type="number" min="0" name="altura" id="altura_field" required class="form-control"
                placeholder="Altura">
            </div>
          </div>
        </div>

        <div class="mt-3" id="bottom_menu" class="d-flex justify-content-center">
          <a href="/" id="home_btn" class="btn btn-outline-secondary"
            style="color: var(--color-primary); margin-right: 10px;">Voltar</a>
          <button class="btn btn-primary" form="cadastro" style="background: var(--color-primary);">Cadastrar</button>
        </div>
      </form>
    </div>
  </section>

  <main id="main"></main>

  <a href="#" class="back-to-top d-flex align-items-center justify-content-center"><i
      class="bi bi-arrow-up-short"></i></a>

  <!-- Vendor JS Files -->
  <script src="assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="assets/vendor/aos/aos.js"></script>
  <script src="assets/vendor/glightbox/js/glightbox.min.js"></script>
  <script src="assets/vendor/isotope-layout/isotope.pkgd.min.js"></script>
  <script src="assets/vendor/swiper/swiper-bundle.min.js"></script>
  <script src="assets/vendor/php-email-form/validate.js"></script>

  <script src="assets/js/main.js"></script>

  <!-- Template Main JS File -->
  <script src="assets/js/main.js"></script>
  <script>
    // set the max date of the date selection for today
    document.getElementById("data_nascimento_field").setAttribute("max", new Date().toISOString().split("T")[0]);

    // get the form object
    const form = document.querySelector('form');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();

      const nome = form.nome_completo.value;
      const data_nascimento = form.data_nascimento.value;
      const altura = form.altura.value;
      const peso = form.peso.value;
      const sexo = form.sexo.value;

      try {
        const res = await fetch('/registration', {
          method: 'POST',
          body: JSON.stringify({
            nome,
            data_nascimento,
            altura,
            peso,
            sexo
          }),
          headers: {
            'Content-Type': 'application/json'
          }
        });

        if (res.status === 201) {
          window.alert("Paciente cadastrado com sucesso!");
          form.reset();
        } else {
          window.alert("Paciente não cadastrado. Cheque se os campos foram preenchidos corretamente.");
        }
      } catch (error) {
        console.log(error);
      }
    });
  </script>
</body>

</html>
