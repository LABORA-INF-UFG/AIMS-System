<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">

  <title>AIMS - Paciente</title>
  <meta name="description" content="AIMS Patient Registration">

  <!-- Favicons -->
  <link href="assets/img/icon.png" rel="icon">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;500;600;700&family=Poppins:wght@300;400;500;600;700&family=Source+Sans+Pro:wght@300;400;600;700&display=swap" rel="stylesheet">

  <!-- Vendor Icons -->
  <link href="assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">

  <!-- Tailwind CSS -->
  <link href="assets/css/tailwind.css" rel="stylesheet">
</head>

<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col justify-between">
  <!-- ======= Header ======= -->
  <header id="header" class="bg-white border-b border-gray-200 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <a href="/" class="flex items-center space-x-1">
        <h1 class="text-2xl font-bold tracking-tight text-gray-900">AIMS<span class="text-primary font-black">.</span></h1>
      </a>
    </div>
  </header>

  <!-- ======= Main Content ======= -->
  <main class="flex-grow flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full bg-white p-8 rounded-2xl shadow-sm border border-gray-100">
      
      <!-- Form Header -->
      <div class="text-center mb-8">
        <h2 class="text-3xl font-extrabold text-gray-900 tracking-tight">Cadastro de Paciente</h2>
        <p class="mt-2 text-sm text-gray-500">Insira as informações do paciente para iniciar o registro.</p>
      </div>

      <!-- Registration Form -->
      <form id="cadastro" class="space-y-6">
        
        <!-- Nome Completo -->
        <div>
          <label for="nome_completo_field" class="block text-sm font-semibold text-gray-700">Nome Completo</label>
          <input type="text" name="nome_completo" id="nome_completo_field" required 
            class="mt-1 block w-full px-4 py-2 bg-white border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary text-gray-900 placeholder-gray-400 transition"
            placeholder="Nome Completo">
        </div>

        <!-- Data de Nascimento & Sexo -->
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label for="data_nascimento_field" class="block text-sm font-semibold text-gray-700">Nascimento</label>
            <input type="date" name="data_nascimento" id="data_nascimento_field" required 
              class="mt-1 block w-full px-4 py-2 bg-white border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary text-gray-900 transition">
          </div>
          <div>
            <label for="sexo_field" class="block text-sm font-semibold text-gray-700">Sexo</label>
            <select name="sexo" id="sexo_field" required 
              class="mt-1 block w-full px-4 py-2 bg-white border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary text-gray-900 transition">
              <option value="M">Masculino</option>
              <option value="F">Feminino</option>
            </select>
          </div>
        </div>

        <!-- Peso & Altura -->
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label for="peso_field" class="block text-sm font-semibold text-gray-700">Peso (kg)</label>
            <input type="number" step="0.01" min="0" name="peso" id="peso_field" required 
              class="mt-1 block w-full px-4 py-2 bg-white border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary text-gray-900 placeholder-gray-400 transition"
              placeholder="0.00">
          </div>
          <div>
            <label for="altura_field" class="block text-sm font-semibold text-gray-700">Altura (cm)</label>
            <input type="number" min="0" name="altura" id="altura_field" required 
              class="mt-1 block w-full px-4 py-2 bg-white border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary text-gray-900 placeholder-gray-400 transition"
              placeholder="0">
          </div>
        </div>

        <!-- Buttons -->
        <div class="flex items-center justify-end space-x-3 pt-4 border-t border-gray-100">
          <a href="/" id="home_btn" 
            class="px-4 py-2 border border-gray-300 rounded-lg text-sm font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary/50 transition">
            Voltar
          </a>
          <button type="submit" 
            class="px-5 py-2 bg-primary hover:bg-primary-dark text-white rounded-lg text-sm font-medium shadow-sm focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary/50 transition">
            Cadastrar
          </button>
        </div>
      </form>

    </div>
  </main>

  <!-- ======= Footer ======= -->
  <footer class="bg-white border-t border-gray-200 py-6 text-center text-sm text-gray-500">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <p>&copy; 2026 AIMS System. Todos os direitos reservados.</p>
    </div>
  </footer>

  <script>
    // set the max date of the date selection for today
    document.getElementById("data_nascimento_field").setAttribute("max", new Date().toISOString().split("T")[0]);

    // get the form object
    const form = document.getElementById('cadastro');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();

      const nome = form.nome_completo.value;
      const data_nascimento = form.data_nascimento.value;
      const altura = form.altura.value;
      const peso = form.peso.value;
      const sexo = form.sexo.value;

      try {
        const res = await fetch('/registration', {
          method: 'POST',
          body: JSON.stringify({
            nome,
            data_nascimento,
            altura,
            peso,
            sexo
          }),
          headers: {
            'Content-Type': 'application/json'
          }
        });

        if (res.status === 201) {
          window.alert("Paciente cadastrado com sucesso!");
          form.reset();
        } else {
          window.alert("Paciente não cadastrado. Cheque se os campos foram preenchidos corretamente.");
        }
      } catch (error) {
        console.log(error);
      }
    });
  </script>
</body>

</html>
